<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100" role="img" aria-label="Battery outline">
  <!-- Battery body -->
  <rect x="6" y="18" width="160" height="64" rx="8" ry="8" fill="none" stroke="#000000" stroke-width="6"/>
  <!-- Positive terminal -->
  <rect x="166" y="36" width="18" height="28" rx="3" ry="3" fill="none" stroke="#000000" stroke-width="6"/>
  <!-- Optional inner guide (light gray) - keep transparent by default, commented out
  <rect x="14" y="26" width="144" height="48" rx="6" ry="6" fill="none" stroke="#cccccc" stroke-width="1" />
  -->
  <!-- Small ticks for visual scale (optional) -->
  <g stroke="#000000" stroke-width="1.5">
    <line x1="22" y1="82" x2="22" y2="74" />
    <line x1="46" y1="82" x2="46" y2="74" />
    <line x1="70" y1="82" x2="70" y2="74" />
    <line x1="94" y1="82" x2="94" y2="74" />
    <line x1="118" y1="82" x2="118" y2="74" />
    <line x1="142" y1="82" x2="142" y2="74" />
  </g>
</svg>
